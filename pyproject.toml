[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postops"
version = "0.1.0"
description = "LinkedIn comment-reply assistant: triage comments, draft replies in a fixed opinion standard, and back GitHub-link challenges with local experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
postops = "postops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
