# LiteLLM proxy config, copied from the one in ENTERPILOT/ai-gateway-reproducible-benchmark
# (remote/gateways/litellm/config.yaml, commit 387c98e) so the gateway-side settings are identical:
# no auth, no retries, spend logs off. Only api_base differs: the mock runs on the host here.
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: sk-bench-test-key
      api_base: http://127.0.0.1:9999/v1

general_settings:
  master_key: null
  disable_spend_logs: true

litellm_settings:
  num_retries: 0
  request_timeout: 60
  drop_params: true
  set_verbose: false
